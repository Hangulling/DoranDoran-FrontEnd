# 새 태그 이름 형식 (v1.2.3)
name-template: 'Release v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'

# 릴리즈 노트에 표시할 카테고리 정의
categories:
  - title: '🚀 새로운 기능 추가'
    labels:
      - 'feat'
      - 'Feat' # 팀의 대문자 컨벤션 지원

  - title: '🐞 버그 수정'
    labels:
      - 'fix'
      - 'Fix'

  - title: '🎨 디자인 및 UI 개선'
    labels:
      - 'design'
      - 'Design'

  - title: '🛠️ 유지보수 및 리팩토링'
    labels:
      - 'chore'
      - 'Chore'
      - 'refactor'
      - 'style'

# 변경된 내용 하나하나를 표시할 형식 정의
change-template: '- $TITLE ([#$NUMBER]($URL)) @$AUTHOR'

# 전체 릴리즈 노트의 레이아웃
template: |
  ## 🌈 주요 변경사항

  $CHANGES

no-changes-template: '사용자에게 노출되는 변경사항 없음'

# 버전 계산 로직
version-resolver:
  major:
    labels:
      - 'breaking'
      - 'major'
  minor:
    labels:
      - 'feat'
  patch:
    labels:
      - 'fix'
      - 'patch'
  default: patch
