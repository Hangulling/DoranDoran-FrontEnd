name: iOS Deployment

on:
  push:
    branches: ['main']
  workflow_dispatch:
    inputs:
      lane:
        description: 'fastlane lane to run'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - generate_certs
      build_number:
        description: 'build number (only for release)'
        required: false
        default: ''

jobs:
  build-ios:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6

      - name: List Xcode versions
        run: ls -1 /Applications | grep Xcode

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.2.app

      - name: Show selected Xcode
        run: xcodebuild -version

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.x

      - name: Install dependencies
        run: npm ci

      - name: Create .env.production file
        run: |
          echo "${{ secrets.ENV_PRODUCTION }}" > .env.production

      - name: Create GoogleService-Info.plist
        run: |
          echo "${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}" | base64 --decode > ios/App/App/GoogleService-Info.plist

      - name: Build Web Assets & Sync Capacitor
        run: |
          npm run build
          npx cap sync ios

      - name: Link GoogleService-Info.plist and Configure Info.plist
        run: ruby scripts/add-google-service.rb

      - name: Setup Ruby (Bundler)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler: 2.4.19
          bundler-cache: true

      - name: Install Ruby Gems
        working-directory: ios/App
        run: bundle install

      - name: Pod install (repo update)
        working-directory: ios/App
        run: bundle exec pod install --repo-update

      - name: Run Fastlane (workflow_dispatch lane 선택)
        if: github.event_name == 'workflow_dispatch'
        working-directory: ios
        env:
          BUNDLE_GEMFILE: App/Gemfile
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
        run: |
          if [ "${{ inputs.lane }}" = "generate_certs" ]; then
            bundle exec fastlane generate_certs
          else
            if [ -n "${{ inputs.build_number }}" ]; then
              bundle exec fastlane release build_number:${{ inputs.build_number }}
            else
              bundle exec fastlane release build_number:${{ github.run_number }}
            fi
          fi

      - name: Run Fastlane (push to main이면 release 기본)
        if: github.event_name == 'push'
        working-directory: ios
        env:
          BUNDLE_GEMFILE: App/Gemfile
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
        run: bundle exec fastlane release build_number:${{ github.run_number }}

      - name: Print gym log on failure
        if: failure()
        run: |
          echo "===== gym log (last 250 lines) ====="
          tail -n 250 /Users/runner/Library/Logs/gym/App-App.log || true
          echo "===== signing/entitlement lines (filtered) ====="
          egrep -n "Provisioning|entitlement|codesign|CodeSign|Signing|requires a provisioning|No profile|error:" /Users/runner/Library/Logs/gym/App-App.log | tail -n 150 || true
