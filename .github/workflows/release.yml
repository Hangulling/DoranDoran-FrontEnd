name: Release & Tag

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Configure Git
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"

      # 버전 범프 및 태그 생성
      - name: Run Standard Version & Capture Tag
        id: versioning
        run: |
          # standard-version 실행 (package.json 수정 및 vX.Y.Z 태그 생성)
          npx standard-version --skip.changelog 

          # Git History에서 최신 태그 이름 (v1.2.1 등)을 추출하여 변수에 저장
          NEW_TAG=$(git describe --tags --abbrev=0)
          echo "tag_name=$NEW_TAG" >> $GITHUB_OUTPUT # 다음 스텝으로 전달

      # 원격 저장소에 커밋과 태그 푸시
      - name: Push Version Update and Tag
        run: |
          # standard-version이 생성한 커밋과 태그를 함께 푸시
          git push --follow-tags origin main

      # GitHub Release 등록
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.versioning.outputs.tag_name }}
          name: Release ${{ steps.versioning.outputs.tag_name }}
          generate_release_notes: true
          token: ${{ secrets.GITHUB_TOKEN }}
