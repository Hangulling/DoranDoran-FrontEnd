name: Release & Tag

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # 전체 히스토리 가져오기
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Configure Git
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"

      # Standard Version 실행 (커밋 메시지 분석 -> 버전 업 -> 태그 생성 -> CHANGELOG 생성)
      - name: Run Standard Version
        run: |
          # --skip.changelog를 빼면 CHANGELOG.md도 자동으로 만들어줍니다.
          # package.json 버전업 + git tag 생성까지 여기서 다 합니다.
          npx standard-version

      # 변경된 package.json, CHANGELOG.md, 그리고 새 태그를 원격 저장소에 푸시
      - name: Push Version Commit and Tag
        run: |
          git push --follow-tags origin main

      # 릴리즈 게시
      - name: Publish Release
        uses: release-drafter/release-drafter@v5
        with:
          publish: true
          tag: $(git describe --tags --abbrev=0)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
